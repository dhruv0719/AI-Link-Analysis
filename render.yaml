# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-link-analysis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai            # openai | anthropic | gemini
      - key: OPENAI_API_KEY
        sync: false              # set in the Render dashboard, never in git
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: TRUST_PROXY_HEADERS
        value: "true"            # real client IP for rate limiting behind Render's proxy
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
